<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>Valorant Agent Tier List</title>
        <meta name="viewport" content="width=device-width"/>
        <link rel="stylesheet" href="../tierlist_style.css"/>
        <link rel="icon" href="/valorant/icons/agent.png"/>

        <!-- <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <meta http-equiv="Pragma" content="no-cache">

        <div id="body">
            <!-- <img class="header" src="https://media.valorant-api.com/maps/224b0a95-48b9-f703-1bd8-67aca101a61f/listviewicon.png"/> -->
            <h1>Split</h1>
            <div id="main">
                <div class="tier s">S</div>
                <div class="tier a">A</div>
                <div class="tier b">B</div>
                <div class="tier c">C</div>

                <div class="role duelist"><img class="role" src="../icons/duelist.png"/></div>
                <div class="role initiator"><img class="role" src="../icons/initiator.png"/></div>
                <div class="role controller"><img class="role" src="../icons/controller.png"/></div>
                <div class="role sentinel"><img class="role" src="../icons/sentinel.png"/></div>
                <div class="role flex"><img class="role" src="../icons/agent.png"/></div>

                <div class="agents s duelist">
                    <img class="agent" src="../icons/Raze.png"/>
                    <img class="agent" src="../icons/Neon.png"/>
                </div>
                <div class="agents a duelist">
                    <img class="agent" src="../icons/Jett.png"/>
                    <img class="agent" src="../icons/Waylay.png"/>
                    <img class="agent" src="../icons/Yoru.png"/>
                </div>
                <div class="agents b duelist">
                    <img class="agent" src="../icons/Iso.png"/>
                    <img class="agent" src="../icons/Reyna.png"/>
                    <img class="agent" src="../icons/Phoenix.png"/>
                </div>
                <div class="agents c duelist"></div>

                <div class="agents s initiator">
                    <img class="agent" src="../icons/Fade.png"/>
                    <img class="agent" src="../icons/Skye.png"/>
                </div>
                <div class="agents a initiator">
                    <img class="agent" src="../icons/Gekko.png"/>
                    <img class="agent" src="../icons/Breach.png"/>
                    <img class="agent" src="../icons/Tejo.png"/>
                </div>
                <div class="agents b initiator">
                    <img class="agent" src="../icons/Sova.png"/>
                </div>
                <div class="agents c initiator">
                    <img class="agent" src="../icons/KAY_O.png"/>
                </div>

                <div class="agents s controller">
                    <img class="agent" src="../icons/Clove.png"/>
                </div>
                <div class="agents a controller">
                    <img class="agent" src="../icons/Miks.png"/>
                    <img class="agent" src="../icons/Omen.png"/>
                </div>
                <div class="agents b controller">
                    <img class="agent" src="../icons/Brimstone.png"/>
                    <img class="agent" src="../icons/Astra.png"/>
                </div>
                <div class="agents c controller">
                    <img class="agent" src="../icons/Harbor.png"/>
                    <img class="agent" src="../icons/Viper.png"/>
                </div>

                <div class="agents s sentinel">
                    <img class="agent" src="../icons/Sage.png"/>
                </div>
                <div class="agents a sentinel">
                    <img class="agent" src="../icons/Cypher.png"/>
                    <img class="agent" src="../icons/Deadlock.png"/>
                    <img class="agent" src="../icons/Killjoy.png"/>
                    <img class="agent" src="../icons/Veto.png"/>
                </div>
                <div class="agents b sentinel">
                    <img class="agent" src="../icons/Vyse.png"/>
                </div>
                <div class="agents c sentinel">
                    <img class="agent" src="../icons/Chamber.png"/>
                </div>

                <div class="agents s flex double_s">
                    <img class="agent" src="../icons/Waylay.png"/>
                    <img class="agent" src="../icons/Yoru.png"/>
                    <img class="agent" src="../icons/Neon.png"/>
                    <img class="agent" src="../icons/Jett.png"/>
                    <img class="agent" src="../icons/Viper.png"/>
                    <img class="agent" src="../icons/Deadlock.png"/>
                    <img class="agent" src="../icons/Sage.png"/>
                    <img class="agent" src="../icons/Chamber.png"/>
                </div>
                <div class="agents a flex double_a">
                    <img class="agent" src="../icons/Phoenix.png"/>
                    <img class="agent" src="../icons/Iso.png"/>
                    <img class="agent" src="../icons/Reyna.png"/>
                    <img class="agent" src="../icons/Tejo.png"/>
                    <img class="agent" src="../icons/Vyse.png"/>
                </div>
            </div>
